openapi: 3.0.3
info:
  title: 'GridSync authenticated API'
  version: 2.0.0
  description: 'Supabase Auth and RLS. All mutations require JSON and X-GridSync-Request: 1. See docs/API.md for payloads. Payments are test-only; metering is simulated/manual.'
servers:
  -
    url: /api
security:
  -
    sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gs_access
paths:
  /health:
    get:
      summary: 'Public configuration health'
      parameters: []
      responses:
        '200':
          description: 'Success; creates may return 201'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Sign in or refresh required'
        '403':
          description: 'Authorization denied'
        '409':
          description: Conflict
      security: []
  /auth/register:
    post:
      summary: 'Public: create customer'
      parameters:
        -
          name: X-GridSync-Request
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
      responses:
