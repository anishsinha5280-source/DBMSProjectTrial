          description: 'Success; creates may return 201'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Sign in or refresh required'
        '403':
          description: 'Authorization denied'
        '409':
          description: Conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              payload:
                value: {}
